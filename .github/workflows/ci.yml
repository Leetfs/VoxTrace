name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax check
        run: python -m compileall -q voxtrace

      - name: Build GUI
        shell: cmd
        run: scripts\build_gui.cmd

      - name: Build FastScan
        shell: cmd
        run: scripts\build_fastscan.cmd

      - name: Build relay (compile check)
        shell: cmd
        run: dotnet build relay -c Release

      - name: Smoke test CLI
        run: python -m voxtrace --help
